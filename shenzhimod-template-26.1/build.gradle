import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.4.20"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	// Only used when the optional Carpet reference dependency is enabled (see dependencies block).
	maven {
		name = 'masa'
		url = 'https://masa.dy.fi/maven'
		content {
			includeGroup 'carpet'
		}
	}
	// JEI 的 API 仓库。只在编译期使用：插件类引用 JEI 的 API，运行时由玩家自己的 JEI 提供。
	maven {
		name = 'blamejared'
		url = 'https://maven.blamejared.com/'
		content {
			includeGroup 'mezz.jei'
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// Optional Carpet reference jar (compile-only). It exists purely so a developer can
	// re-verify the bastion spawn parameters used by this mod.
	// It is NOT needed to build or run ShenzhiMod, so it stays opt-in to keep fresh
	// clones buildable without the masa maven:
	//     .\gradlew.bat build -PcarpetReference=true
	// NOTE: Loom 1.17 has no "modCompileOnly" configuration; a plain compileOnly is enough
	// because the jar is only read, never loaded. Never switch this to modImplementation
	// unless the mod is intentionally made to depend on Carpet at runtime.
	if (providers.gradleProperty('carpetReference').map { it.toBoolean() }.getOrElse(false)) {
		dependencies.add('compileOnly', "carpet:fabric-carpet:${project.carpet_version}")
	}

	// JEI 集成（可选依赖）。
	// - 用官方提供的 **纯 API 构件** `jei-26.1-fabric-api`（会传递依赖 `jei-26.1-common-api`，
	//   里面就是完整的 `mezz.jei.api` 包），下载量只有一百多 KB；
	// - 只进 `compileOnly`：**不打包、不要求玩家安装**，没装 JEI 时插件类根本不会被加载
	//   （入口点是 `fabric.mod.json` 里的 `jei_mod_plugin`，只有 JEI 自己会去读）；
	// - 坐标按 MC 补丁版本区分（`26.1` / `26.1.1` ...），升级 MC 时同步改 `gradle.properties` 里的 `jei_version`。
	// - Loom 1.17 已没有 `modCompileOnly` 配置（见上），普通 `compileOnly` 即可：
	//   JEI 的构件本身就是官方映射，与我们的开发/运行命名空间一致，不需要 remap。
	compileOnly "mezz.jei:jei-26.1-fabric-api:${project.jei_version}"

	// 想在**开发环境里真的跑一遍 JEI**（检查分类、配方面板、核心的物品信息页）时用：
	//     .\gradlew.bat runClient -PjeiRuntime=true
	// `localRuntime` = 只进**开发运行环境**的模组：不会打进 jar、不会成为发布依赖、
	// 不会写进任何被跟踪的文件；默认构建（不带 -PjeiRuntime）完全不碰它。
	// 之所以做成开关而不是默认加载：日常开发没必要让每次 runClient 都多下一个 1.5 MB 的完整 mod。
	if (providers.gradleProperty('jeiRuntime').map { it.toBoolean() }.getOrElse(false)) {
		dependencies.add('localRuntime', "mezz.jei:jei-26.1-fabric:${project.jei_version}")
	}
}

// NOTE: `fabricApi.configureDataGeneration` above already registers `src/main/generated`
// as an extra resource directory of the main source set, so generated recipes/models/
// language files/data tables ship inside the jar automatically. Do NOT add that directory
// a second time here: Gradle treats the same directory twice as duplicate entries and
// `processResources` fails with "is a duplicate but no duplicate handling strategy".

// Gradle 9 validates that no two tasks race on the same location. `sourcesJar` reads the
// main source set (which includes src/main/generated) while `runDatagen` writes it, so
// running `gradlew build runDatagen` in one go fails validation. Declaring the ordering is
// the documented fix and does NOT force datagen to run during a plain `build`.
// `runDatagen` is created lazily by Loom, so resolve it through a lazy collection
// (calling tasks.named('runDatagen') here would fail during project evaluation).
tasks.matching { it.name == 'sourcesJar' }.configureEach {
	mustRunAfter(tasks.matching { it.name == 'runDatagen' })
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.JVM_25
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
