import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.4.20"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	// Only used when the optional Carpet reference dependency is enabled (see dependencies block).
	maven {
		name = 'masa'
		url = 'https://masa.dy.fi/maven'
		content {
			includeGroup 'carpet'
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// Optional Carpet reference jar (compile-only). It exists purely so a developer can
	// re-verify the bastion spawn parameters documented in the requirements doc (§6.7).
	// It is NOT needed to build or run ShenzhiMod, so it stays opt-in to keep fresh
	// clones buildable without the masa maven:
	//     .\gradlew.bat build -PcarpetReference=true
	// NOTE: Loom 1.17 has no "modCompileOnly" configuration; a plain compileOnly is enough
	// because the jar is only read, never loaded. Never switch this to modImplementation
	// unless the mod is intentionally made to depend on Carpet at runtime.
	if (providers.gradleProperty('carpetReference').map { it.toBoolean() }.getOrElse(false)) {
		dependencies.add('compileOnly', "carpet:fabric-carpet:${project.carpet_version}")
	}
}

// NOTE: `fabricApi.configureDataGeneration` above already registers `src/main/generated`
// as an extra resource directory of the main source set, so generated recipes/models/
// language files/data tables ship inside the jar automatically. Do NOT add that directory
// a second time here: Gradle treats the same directory twice as duplicate entries and
// `processResources` fails with "is a duplicate but no duplicate handling strategy".

// Gradle 9 validates that no two tasks race on the same location. `sourcesJar` reads the
// main source set (which includes src/main/generated) while `runDatagen` writes it, so
// running `gradlew build runDatagen` in one go fails validation. Declaring the ordering is
// the documented fix and does NOT force datagen to run during a plain `build`.
// `runDatagen` is created lazily by Loom, so resolve it through a lazy collection
// (calling tasks.named('runDatagen') here would fail during project evaluation).
tasks.matching { it.name == 'sourcesJar' }.configureEach {
	mustRunAfter(tasks.matching { it.name == 'runDatagen' })
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.JVM_25
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
